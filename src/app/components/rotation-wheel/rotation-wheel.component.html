<figure class="wheel">
  <svg viewBox="0 0 200 200" role="img" [attr.aria-label]="'Tour actuel : ' + (beneficiaire()?.nom ?? 'à définir')">
    <circle cx="100" cy="100" r="84" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" />
    <circle cx="100" cy="100" r="46" fill="var(--paper-soft)" stroke="var(--line-soft)" stroke-width="1" />

    @for (e of emplacements(); track e.membre.id) {
      <g [attr.transform]="'translate(' + e.x + ',' + e.y + ')'">
        <circle
          r="17"
          [attr.fill]="e.estActuel ? 'var(--gold)' : e.estPasse ? 'var(--teal)' : 'var(--card)'"
          [attr.stroke]="e.estActuel ? 'var(--gold-deep)' : e.estPasse ? 'var(--teal-deep)' : 'var(--line)'"
          stroke-width="1.6"
        />
        <text
          text-anchor="middle"
          dy="0.35em"
          font-family="IBM Plex Sans"
          font-size="11"
          font-weight="700"
          [attr.fill]="e.estActuel ? 'var(--ink)' : e.estPasse ? 'var(--paper-soft)' : 'var(--ink-soft)'"
        >{{ initiales(e.membre.nom) }}</text>
      </g>
    }

    <text x="100" y="94" text-anchor="middle" font-family="IBM Plex Sans" font-size="9" font-weight="600" fill="var(--ink-soft)">TOUR</text>
    <text x="100" y="113" text-anchor="middle" font-family="Fraunces" font-size="20" font-weight="600" fill="var(--ink)">{{ cycleActuel() }}</text>
  </svg>

  <figcaption>
    @if (beneficiaire(); as b) {
      <span class="wheel__label">Bénéficiaire de ce tour</span>
      <span class="wheel__name">{{ b.nom }}</span>
    } @else {
      <span class="wheel__label">Ajoutez des membres pour démarrer la rotation</span>
    }
  </figcaption>
</figure>
